[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 44444444
via_ir = true
bytecode_hash = "none"
ffi = false
fs_permissions = []
# Salt mining loops hash tens of thousands of candidates; give tests room rather than a tight budget.
gas_limit = "18446744073709551615"

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
